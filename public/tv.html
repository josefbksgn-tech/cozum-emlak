<!doctype html><html lang="tr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Vitrin | Çözüm Emlak</title>
<style>*{box-sizing:border-box}html,body{margin:0;height:100%;background:#151515;color:#fff;font-family:system-ui,sans-serif;overflow:hidden;cursor:none}
.s{position:absolute;inset:0;opacity:0;transition:opacity 1s;background-size:cover;background-position:center}.s.on{opacity:1}
.c{position:absolute;left:0;right:0;bottom:0;padding:4vh 4vw;background:linear-gradient(transparent,#000d);display:flex;justify-content:space-between;align-items:flex-end;gap:3vw}
h1{font-size:5vh;margin:0}p{font-size:3vh;margin:.5vh 0 0;color:#ddd}.p{font-size:8vh;font-weight:800;color:#3ddc84;white-space:nowrap}
.t{position:absolute;top:3vh;left:4vw;background:#c8102e;padding:1vh 2vw;font-size:3vh;font-weight:700;border-radius:6px}.ph{position:absolute;top:3vh;right:4vw;font-size:4vh;font-weight:700;background:#000a;padding:1vh 2vw;border-radius:6px}</style></head><body>
<div id="v"></div><div class="ph">0544 360 16 19</div>
<script src="fields.js"></script><script>
loadSettings().then(()=>document.querySelector('.ph').textContent=fmt(SITE.phone));let L=[],i=0;async function ld(){const r=await fetch('/api/listings?status=active').then(r=>r.json());L=r.filter(x=>x.images.length);build()}
function build(){document.getElementById('v').innerHTML=L.map(l=>`<div class="s" style="background-image:url('${esc(l.images[0])}')"><div class="t">${l.type==='rent'?'KİRALIK':'SATILIK'}</div><div class="c"><div><h1>${esc(l.title)}</h1><p>${esc(l.hood)} ${esc(l.district)} ${l.area?'· '+l.area+' m²':''}</p></div><div class="p">${TL(l.price)}</div></div></div>`).join('');i=0;show()}
function show(){const s=document.querySelectorAll('.s');s.forEach((e,k)=>e.classList.toggle('on',k===i))}
setInterval(()=>{if(L.length){i=(i+1)%L.length;show()}},8000);setInterval(ld,60000);ld();
</script></body></html>
